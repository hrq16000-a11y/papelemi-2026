name: PapeLemi Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/catalog-source-of-truth-01a-20261125
      - feat/checkout-integrity-1b-20261125

permissions:
  contents: read

concurrency:
  group: papelemi-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build
