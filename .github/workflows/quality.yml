name: PapeLemi Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: papelemi-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Changed-file lint, tests, TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed TypeScript files
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'src/**/*.ts' 'src/**/*.tsx')
          if (("${#files[@]}" > 0)); then
            bunx eslint "${files[@]}" --rule 'prettier/prettier: off'
          else
            echo "No changed TypeScript files."
          fi

      - name: Check formatting of newly added modules
        run: bunx prettier --check src/lib/catalog.repository.server.ts src/test/catalog-repository.test.ts

      - name: Unit tests
        run: bun run test

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build
