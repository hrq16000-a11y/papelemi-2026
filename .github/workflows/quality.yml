name: PapeLemi Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: papelemi-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Changed-file lint, tests, TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint changed TypeScript files
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'src/**/*.ts' 'src/**/*.tsx')
          if (("${#files[@]}" > 0)); then
            bunx eslint "${files[@]}" --rule 'prettier/prettier: off'
          else
            echo "No changed TypeScript files."
          fi

      - name: Unit tests
        run: bun run test

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Install Chromium for Preview QA
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: SSR and responsive Preview QA
        env:
          PREVIEW_URL: https://papelemi-git-feat-catalog-source-of-truth-01a-20261125-msolus.vercel.app
        run: node scripts/qa/papelemi-preview.mjs
