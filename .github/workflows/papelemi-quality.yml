name: PapeLemi quality gates

on:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: papelemi-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, targeted lint and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      # The repository-wide Prettier baseline is currently noisy; check touched modules without reformatting unrelated pages.
      - name: Targeted lint
        run: >-
          bunx eslint --rule 'prettier/prettier: off'
          src/lib/cart-storage.ts
          src/lib/order-integrity.ts
          src/lib/cart.tsx
          src/lib/catalog.repository.server.ts
          src/lib/shop.functions.ts
          src/lib/mp.ts
          src/routes/checkout.tsx
          'src/routes/produto.$slug.tsx'
          src/test/cart-storage.test.ts
          src/test/order-integrity.test.ts

      - name: TypeScript
        run: bunx tsc --noEmit
