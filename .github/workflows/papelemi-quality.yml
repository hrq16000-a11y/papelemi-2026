name: PapeLemi quality gates

on:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: write

concurrency:
  group: papelemi-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, targeted lint and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      # The repository-wide Prettier baseline is currently noisy; check touched modules without reformatting unrelated pages.
      - name: Targeted lint
        run: >-
          bunx eslint --rule 'prettier/prettier: off'
          src/lib/cart-storage.ts
          src/lib/order-integrity.ts
          src/lib/customer-summary.ts
          src/lib/cart.tsx
          src/lib/catalog.repository.server.ts
          src/lib/shop.functions.ts
          src/lib/mp.ts
          src/routes/admin.tsx
          src/routes/checkout.tsx
          'src/routes/produto.$slug.tsx'
          src/test/cart-storage.test.ts
          src/test/order-integrity.test.ts
          src/test/customer-summary.test.ts

      - name: TypeScript
        run: bunx tsc --noEmit -p tsconfig.order-integrity.json

  reconstruct-emporio-schema:
    name: Reconstruct Emporio schema locally (no production access)
    if: github.ref == 'refs/heads/feat/papelemi-emp-or-core-baseline-01' && hashFiles('docs/operations/IMPORT_EMP_ORIO_SCHEMA_SNAPSHOT.md') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PapeLemi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Emporio source
        uses: actions/checkout@v4
        with:
          repository: hrq16000-a11y/emporiolelecute-2026
          ref: main
          path: emporio
          fetch-depth: 1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        working-directory: emporio
        run: supabase start

      - name: Apply all versioned Emporio migrations locally
        working-directory: emporio
        run: supabase db reset --local

      - name: Export schema-only snapshot and generated types
        working-directory: emporio
        run: |
          mkdir -p ../docs/operations/reference
          supabase db dump --local --schema public -f ../docs/operations/reference/EMPORIO_PUBLIC_SCHEMA_2026-11-25.sql
          supabase gen types typescript --local --schema public > ../docs/operations/reference/EMPORIO_DATABASE_TYPES_2026-11-25.ts

      - name: Record migration reconstruction metadata
        working-directory: emporio
        run: |
          {
            echo "# Emporio local migration reconstruction"
            echo
            echo "- Source repository: hrq16000-a11y/emporiolelecute-2026"
            echo "- Source ref: main"
            echo "- Source SHA: $(git rev-parse HEAD)"
            echo "- Migration files: $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
            echo "- Generated from local migrations only; no hosted database was queried."
            echo "- No row data, auth users, credentials or secrets are included."
          } > ../docs/operations/reference/EMPORIO_SCHEMA_SNAPSHOT_README.md

      - name: Stop local Supabase
        if: always()
        working-directory: emporio
        run: supabase stop --no-backup || true

      - name: Commit generated schema reference
        run: |
          rm -f docs/operations/IMPORT_EMP_ORIO_SCHEMA_SNAPSHOT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/reference/ docs/operations/IMPORT_EMP_ORIO_SCHEMA_SNAPSHOT.md
          if git diff --cached --quiet; then
            echo "No schema snapshot changes."
            exit 0
          fi
          git commit -m "chore(db): add reconstructed Emporio schema reference"
          git push origin "HEAD:$GITHUB_REF_NAME"
