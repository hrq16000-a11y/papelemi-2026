name: PapeLemi quality gates

on:
  push:
    branches:
      - feat/order-integrity-01b-20261125
  pull_request:
    branches:
      - main
      - feat/catalog-source-of-truth-01a-20261125

permissions:
  contents: read

concurrency:
  group: papelemi-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: TypeScript
        run: bunx tsc --noEmit
