name: PapeLemi — build do painel original Empório

on:
  push:
    branches:
      - feat/emporio-admin-replica-01-20261126
    paths:
      - apps/emporio-admin/adapter/**
      - apps/emporio-admin/source/src/pages/admin/**
      - apps/emporio-admin/source/src/components/**
      - apps/emporio-admin/source/src/hooks/**
      - apps/emporio-admin/source/src/lib/**
      - apps/emporio-admin/source/src/integrations/**
      - src/routes/admin-original.tsx

permissions:
  contents: write

jobs:
  build-admin:
    name: Build isolated original admin SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install isolated Empório admin dependencies
        working-directory: apps/emporio-admin/adapter
        run: bun install
      - name: Commit dependency lockfile if it changed
        working-directory: apps/emporio-admin/adapter
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Admin dependency lockfile is already current."
          else
            git commit -m "chore(admin): sync isolated admin dependency lock"
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - name: Build PapeLemi-branded admin bundle
        working-directory: apps/emporio-admin/adapter
        run: bun run build
