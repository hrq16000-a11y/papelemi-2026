name: PapeLemi Emporio transfer validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EMPORIO_SOURCE_DIR: /tmp/emporio-source
      EMPORIO_SOURCE_SHA: d01d843c266b5a32d03af22eeaac6eda4a7fcf0f
    steps:
      - name: Checkout PapeLemi integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/catalog-admin-parity-01-20261125
          fetch-depth: 0

      - name: Checkout pinned public Emporio source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/hrq16000-a11y/emporiolelecute-2026.git "$EMPORIO_SOURCE_DIR"
          git -C "$EMPORIO_SOURCE_DIR" fetch --depth=1 origin "$EMPORIO_SOURCE_SHA"
          git -C "$EMPORIO_SOURCE_DIR" checkout --detach "$EMPORIO_SOURCE_SHA"
          test "$(git -C "$EMPORIO_SOURCE_DIR" rev-parse HEAD)" = "$EMPORIO_SOURCE_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Regenerate the pinned source transfer
        run: node scripts/emp-orio/transfer-source.mjs

      - name: Verify the committed transfer is deterministic
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Generated transfer differs from the reviewed branch; inspect the diff before committing."
            exit 1
          fi

      - name: Install dependencies without changing the lockfile
        run: bun install --frozen-lockfile

      - name: Validate the isolated engine migration and source boundaries
        run: node scripts/emp-orio/validate-papelemi-engine-migration.mjs

      - name: Build PapeLemi with original admin runtime mounted
        run: bun run build

      - name: SSR smoke test for original admin entry route
        shell: bash
        run: |
          bun run dev --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/papelemi-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            root_status="$(curl -sS -o "$RUNNER_TEMP/root.html" -w '%{http_code}' http://127.0.0.1:4173/ || true)"
            if [ "$root_status" = "200" ]; then break; fi
            sleep 1
          done
          admin_status="$(curl -sS -o "$RUNNER_TEMP/admin-login.html" -w '%{http_code}' http://127.0.0.1:4173/admin/login || true)"
          if [ "$root_status" != "200" ] || [ "$admin_status" != "200" ]; then
            echo "SSR smoke failed — root: $root_status; admin: $admin_status"
            tail -n 160 "$RUNNER_TEMP/papelemi-preview.log" || true
            head -n 100 "$RUNNER_TEMP/admin-login.html" || true
            exit 1
          fi
          grep -q "Painel administrativo" "$RUNNER_TEMP/admin-login.html"
          echo "SSR /admin/login PASS."
