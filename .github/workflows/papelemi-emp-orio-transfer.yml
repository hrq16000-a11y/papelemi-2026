name: PapeLemi Emporio transfer validation

on:
  push:
    branches:
      - feat/catalog-admin-parity-01-20261125
    paths:
      - ".github/workflows/papelemi-emp-orio-transfer.yml"
      - "scripts/emp-orio/transfer-source.mjs"
      - "scripts/emp-orio/validate-papelemi-engine-migration.mjs"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validate-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EMPORIO_SOURCE_DIR: /tmp/emporio-source
      EMPORIO_SOURCE_SHA: d01d843c266b5a32d03af22eeaac6eda4a7fcf0f
    steps:
      - name: Checkout PapeLemi integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/catalog-admin-parity-01-20261125
          fetch-depth: 0

      - name: Checkout pinned public Emporio source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/hrq16000-a11y/emporiolelecute-2026.git "$EMPORIO_SOURCE_DIR"
          git -C "$EMPORIO_SOURCE_DIR" fetch --depth=1 origin "$EMPORIO_SOURCE_SHA"
          git -C "$EMPORIO_SOURCE_DIR" checkout --detach "$EMPORIO_SOURCE_SHA"
          test "$(git -C "$EMPORIO_SOURCE_DIR" rev-parse HEAD)" = "$EMPORIO_SOURCE_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Regenerate PapeLemi-specific source adapters and branding
        run: node scripts/emp-orio/transfer-source.mjs

      - name: Install dependencies without changing the lockfile
        run: bun install --frozen-lockfile

      - name: Validate isolated engine migration and source boundaries
        run: node scripts/emp-orio/validate-papelemi-engine-migration.mjs

      - name: Build PapeLemi with original admin runtime mounted
        run: bun run build

      - name: SSR smoke test for original admin entry route
        shell: bash
        run: |
          bun run dev --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/papelemi-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            root_status="$(curl -sS -o "$RUNNER_TEMP/root.html" -w '%{http_code}' http://127.0.0.1:4173/ || true)"
            if [ "$root_status" = "200" ]; then break; fi
            sleep 1
          done
          admin_status="$(curl -sS -o "$RUNNER_TEMP/admin-login.html" -w '%{http_code}' http://127.0.0.1:4173/admin/login || true)"
          if [ "$root_status" != "200" ] || [ "$admin_status" != "200" ]; then
            echo "SSR smoke failed — root: $root_status; admin: $admin_status"
            tail -n 160 "$RUNNER_TEMP/papelemi-preview.log" || true
            head -n 100 "$RUNNER_TEMP/admin-login.html" || true
            exit 1
          fi
          grep -q "Painel administrativo" "$RUNNER_TEMP/admin-login.html"
          echo "SSR /admin/login PASS."

      - name: Commit generated PapeLemi source-boundary corrections
        shell: bash
        run: |
          git diff --check
          forbidden="$(git status --porcelain | awk '{print $2}' | grep -E '(^|/)\.env($|\.)|^public/|^src/(assets|data)/|^supabase/seed\.sql$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Refusing to commit excluded secrets, media, or commercial seed paths:"
            echo "$forbidden"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix(engine): apply PapeLemi source boundary transforms"
            git push origin HEAD:feat/catalog-admin-parity-01-20261125
          else
            echo "Source transfer is already deterministic; no commit required."
          fi

      - name: Dispatch final quality gates on the generated branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run .github/workflows/papelemi-quality.yml --ref feat/catalog-admin-parity-01-20261125
