name: PapeLemi — transferência em lote do motor Empório

on:
  push:
    branches:
      - feat/emporio-admin-replica-01-20261126
    paths:
      - .github/workflows/papelemi-emporio-transfer.yml
      - scripts/replicate-emporio-source.mjs

permissions:
  contents: write

concurrency:
  group: papelemi-emporio-source-transfer
  cancel-in-progress: false

jobs:
  transfer:
    name: Vendor original admin engine and database source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PapeLemi transfer branch
        uses: actions/checkout@v4
        with:
          repository: hrq16000-a11y/papelemi-2026
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: papelemi

      - name: Checkout pinned Empório source
        uses: actions/checkout@v4
        with:
          repository: hrq16000-a11y/emporiolelecute-2026
          ref: d01d843c266b5a32d03af22eeaac6eda4a7fcf0f
          path: emporio
          persist-credentials: false

      - name: Transfer source modules as one batch
        run: node papelemi/scripts/replicate-emporio-source.mjs emporio papelemi

      - name: Commit the reproducible source snapshot
        working-directory: papelemi
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/emporio-admin/source apps/emporio-admin/README.md
          if git diff --cached --quiet; then
            echo "Source snapshot already matches the pinned Empório commit."
            exit 0
          fi
          git commit -m "chore(replication): vendor Empório admin and database modules"
          git push origin "HEAD:$BRANCH_NAME"
